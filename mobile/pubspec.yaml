name: widgetry_academy
description: Widgetry Academy app. Flutter, Android and iOS jobs, courses, resume and career guides.
publish_to: none
version: 1.0.0+1

environment:
  sdk: ">=3.12.0 <4.0.0"
  # Play requires Billing Library 8: in_app_purchase_android 0.5, which needs Flutter 3.44
  flutter: ">=3.44.0"

dependencies:
  flutter:
    sdk: flutter

  # State management and architecture
  flutter_bloc: ^9.1.0
  equatable: ^2.0.7
  get_it: ^8.0.3
  injectable: ^2.5.0

  # Navigation
  go_router: ^14.8.1

  # Networking and data
  dio: ^5.8.0
  json_annotation: ^4.9.0
  shared_preferences: ^2.5.3

  # Firebase (same project as the website: flutter-in-10-days)
  firebase_core: ^3.13.0
  firebase_auth: ^5.5.2
  cloud_firestore: ^5.6.6
  google_sign_in: ^7.2.0
  google_fonts: ^6.2.1
  razorpay_flutter: ^1.4.7
  # Google Play Billing with user choice (Google Play or Razorpay, India)
  in_app_purchase: ^3.3.1
  in_app_purchase_android: ^0.5.4
  firebase_messaging: ^15.2.5

  # Device features and UI
  url_launcher: ^6.3.1
  share_plus: ^10.1.4
  cached_network_image: ^3.4.1
  image_picker: ^1.1.2
  pdf: ^3.11.3
  printing: ^5.14.2
  intl: ^0.20.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.4.15
  injectable_generator: ^2.7.0
  json_serializable: ^6.9.5
  bloc_test: ^10.0.0
  mocktail: ^1.0.4
  # App icon and launch screen: dart run flutter_launcher_icons && dart run flutter_native_splash:create
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.6

# image 4.11 (used by pdf/printing) calls archive's decodeLazy, which only exists in newer archive 4.x.
# Another package holds archive back at 4.0.x, so force a version that has it.
dependency_overrides:
  archive: ^4.5.0

flutter:
  uses-material-design: true
  assets:
    - assets/chatbot/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/icon/icon.png
  remove_alpha_ios: true
  adaptive_icon_background: "#0C2A23"
  adaptive_icon_foreground: assets/icon/icon-foreground.png
  adaptive_icon_monochrome: assets/icon/icon-monochrome.png

flutter_native_splash:
  color: "#0C2A23"
  image: assets/icon/splash.png
  android_12:
    color: "#0C2A23"
    image: assets/icon/splash.png
  web: false
