name: widgetry_academy
description: Widgetry Academy app. Flutter, Android and iOS jobs, courses, resume and career guides.
publish_to: none
version: 1.0.0+1

environment:
  sdk: ">=3.8.0 <4.0.0"
  flutter: ">=3.35.0"

dependencies:
  flutter:
    sdk: flutter

  # State management and architecture
  flutter_bloc: ^9.1.0
  equatable: ^2.0.7
  get_it: ^8.0.3
  injectable: ^2.5.0

  # Navigation
  go_router: ^14.8.1

  # Networking and data
  dio: ^5.8.0
  json_annotation: ^4.9.0
  shared_preferences: ^2.5.3

  # Firebase (same project as the website: flutter-in-10-days)
  firebase_core: ^3.13.0
  firebase_auth: ^5.5.2
  cloud_firestore: ^5.6.6
  firebase_messaging: ^15.2.5

  # Device features and UI
  url_launcher: ^6.3.1
  share_plus: ^10.1.4
  cached_network_image: ^3.4.1
  image_picker: ^1.1.2
  pdf: ^3.11.3
  printing: ^5.14.2
  intl: ^0.20.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.4.15
  injectable_generator: ^2.7.0
  json_serializable: ^6.9.5
  bloc_test: ^10.0.0
  mocktail: ^1.0.4

# image 4.11 (used by pdf/printing) calls archive's decodeLazy, which only exists in newer archive 4.x.
# Another package holds archive back at 4.0.x, so force a version that has it.
dependency_overrides:
  archive: ^4.5.0

flutter:
  uses-material-design: true
