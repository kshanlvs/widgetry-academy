<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Our Mentors | Widgetry Academy</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Unbounded:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'DM Sans', sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
    }

    header {
      text-align: center;
      color: white;
      margin-bottom: 60px;
    }

    header h1 {
      font-family: 'Unbounded', sans-serif;
      font-size: 2.5rem;
      font-weight: 700;
      margin-bottom: 10px;
    }

    header p {
      font-size: 1.1rem;
      opacity: 0.9;
    }

    .mentors-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 30px;
      margin-bottom: 50px;
    }

    .mentor-card {
      background: white;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }

    .mentor-card:hover {
      transform: translateY(-5px);
      box-shadow: 0 15px 40px rgba(0, 0, 0, 0.3);
    }

    .mentor-header {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      padding: 30px 20px;
      text-align: center;
      color: white;
    }

    .mentor-name {
      font-family: 'Unbounded', sans-serif;
      font-size: 1.3rem;
      font-weight: 600;
      margin-bottom: 5px;
    }

    .mentor-title {
      font-size: 0.9rem;
      opacity: 0.9;
    }

    .mentor-body {
      padding: 25px;
    }

    .mentor-company {
      font-size: 0.9rem;
      color: #666;
      margin-bottom: 15px;
      padding-bottom: 15px;
      border-bottom: 1px solid #eee;
    }

    .mentor-experience {
      display: inline-block;
      background: #f0f9ff;
      color: #667eea;
      padding: 5px 12px;
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: 600;
      margin-bottom: 15px;
    }

    .skills-label {
      font-weight: 600;
      color: #333;
      margin-top: 15px;
      margin-bottom: 10px;
      font-size: 0.9rem;
    }

    .skills {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 20px;
    }

    .skill-tag {
      background: #f3f4f6;
      color: #374151;
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 0.8rem;
      font-weight: 500;
    }

    .skill-tag.flutter {
      background: #0553B1;
      color: white;
    }

    .skill-tag.android {
      background: #3DDC84;
      color: white;
    }

    .skill-tag.ios {
      background: #000;
      color: white;
    }

    .skill-tag.web {
      background: #FF9500;
      color: white;
    }

    .skill-tag.backend {
      background: #059669;
      color: white;
    }

    .skill-tag.python {
      background: #3776AB;
      color: white;
    }

    .skill-tag.ui {
      background: #EC4899;
      color: white;
    }

    .skill-tag.cloud {
      background: #4F46E5;
      color: white;
    }

    .courses-label {
      font-weight: 600;
      color: #333;
      margin-bottom: 8px;
      font-size: 0.9rem;
    }

    .courses {
      color: #666;
      font-size: 0.9rem;
      margin-bottom: 20px;
    }

    .mentor-contacts {
      display: flex;
      gap: 12px;
      justify-content: center;
    }

    .contact-link {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: #f0f9ff;
      text-decoration: none;
      transition: background 0.3s;
    }

    .contact-link:hover {
      background: #667eea;
    }

    .contact-link svg {
      width: 20px;
      height: 20px;
      fill: #667eea;
    }

    .contact-link:hover svg {
      fill: white;
    }

    .loading {
      text-align: center;
      color: white;
      font-size: 1.1rem;
      padding: 50px;
    }

    .no-mentors {
      text-align: center;
      color: white;
      background: rgba(255, 255, 255, 0.1);
      padding: 50px;
      border-radius: 12px;
      backdrop-filter: blur(10px);
    }

    .join-banner {
      background: rgba(255, 255, 255, 0.95);
      padding: 40px;
      border-radius: 12px;
      text-align: center;
      margin-bottom: 50px;
    }

    .join-banner h2 {
      font-family: 'Unbounded', sans-serif;
      color: #667eea;
      margin-bottom: 10px;
    }

    .join-banner p {
      color: #666;
      margin-bottom: 20px;
      font-size: 1rem;
    }

    .join-banner a {
      display: inline-block;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      padding: 12px 30px;
      border-radius: 6px;
      text-decoration: none;
      font-weight: 600;
      transition: transform 0.3s;
    }

    .join-banner a:hover {
      transform: scale(1.05);
    }

    @media (max-width: 768px) {
      header h1 {
        font-size: 2rem;
      }

      .mentors-grid {
        grid-template-columns: 1fr;
      }

      .join-banner {
        padding: 25px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>Meet Our Mentors</h1>
      <p>Learn from experienced Flutter developers and industry professionals</p>
    </header>

    <div class="join-banner">
      <h2>Want to Teach?</h2>
      <p>Join our mentor program and earn while sharing your knowledge with the next generation of Flutter developers.</p>
      <a href="/pages/apply-mentor.html">Apply to Become a Mentor</a>
    </div>

    <div class="mentors-grid" id="mentorsContainer">
      <div class="loading">Loading mentors...</div>
    </div>
  </div>

  <!-- Firebase SDK -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js";
    import { getFirestore, collection, query, where, orderBy, getDocs } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore.js";
    import { firebaseConfig } from "./firebase-config.js";

    // Initialize Firebase
    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    // Load approved mentors
    async function loadMentors() {
      try {
        const q = query(
          collection(db, 'mentorApplications'),
          where('status', '==', 'approved'),
          orderBy('adminUpdatedAt', 'desc')
        );
        const querySnapshot = await getDocs(q);

        const container = document.getElementById('mentorsContainer');
        container.innerHTML = '';

        if (querySnapshot.empty) {
          container.innerHTML = '<div class="no-mentors" style="grid-column: 1 / -1;">No mentors available yet. Check back soon!</div>';
          return;
        }

        querySnapshot.forEach(doc => {
          const mentor = doc.data();
          const card = createMentorCard(mentor);
          container.appendChild(card);
        });
      } catch (error) {
        console.error('Error loading mentors:', error);
        document.getElementById('mentorsContainer').innerHTML =
          '<div class="no-mentors" style="grid-column: 1 / -1;">Error loading mentors. Please try again later.</div>';
      }
    }

    function createMentorCard(mentor) {
      const card = document.createElement('div');
      card.className = 'mentor-card';

      // Parse skills array
      const skills = Array.isArray(mentor.skills) ? mentor.skills : [];
      const skillsHtml = skills.map(skill =>
        `<span class="skill-tag ${skill.toLowerCase()}">${skill}</span>`
      ).join('');

      // Create contact links
      let contactsHtml = '';
      if (mentor.email) {
        contactsHtml += `
          <a href="mailto:${mentor.email}" class="contact-link" title="Email">
            <svg viewBox="0 0 24 24"><path d="M20 4H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4l-8 5-8-5V6l8 5 8-5v2z"/></svg>
          </a>
        `;
      }
      if (mentor.linkedin) {
        contactsHtml += `
          <a href="${mentor.linkedin}" target="_blank" class="contact-link" title="LinkedIn">
            <svg viewBox="0 0 24 24"><path d="M19 3a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h14m-.5 15.5v-5.3a3.26 3.26 0 0 0-3.26-3.26c-.85 0-1.84.52-2.32 1.39v-1.2h-2.84v8.37h2.84v-4.93c0-.77.62-1.4 1.39-1.4a1.4 1.4 0 0 1 1.4 1.4v4.93h2.84M6.88 8.56a1.68 1.68 0 0 0 1.68-1.68c0-.93-.75-1.69-1.68-1.69a1.69 1.69 0 0 0-1.69 1.69c0 .93.76 1.68 1.69 1.68m1.39 9.94v-8.37H5.5v8.37h2.77z"/></svg>
          </a>
        `;
      }
      if (mentor.phone) {
        const whatsappNumber = mentor.phone.replace(/[^\d]/g, '');
        contactsHtml += `
          <a href="https://wa.me/${whatsappNumber}" target="_blank" class="contact-link" title="WhatsApp">
            <svg viewBox="0 0 24 24"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.67-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.076 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421-7.403h-.004a9.87 9.87 0 00-4.971 1.498l-.356.214-3.699-.971.992 3.605-.235.374a9.86 9.86 0 001.51 5.151 9.88 9.88 0 008.02 4.575c1.074.062 2.133-.195 3.127-.656l.355-.214 3.699.971-.992-3.605.235-.374a9.87 9.87 0 00-1.51-5.151 9.878 9.878 0 00-8.02-4.575zM12 0C5.383 0 0 5.383 0 12s5.383 12 12 12 12-5.383 12-12S18.617 0 12 0z"/></svg>
          </a>
        `;
      }

      card.innerHTML = `
        <div class="mentor-header">
          <div class="mentor-name">${mentor.name}</div>
          <div class="mentor-title">${mentor.role}</div>
        </div>
        <div class="mentor-body">
          ${mentor.company ? `<div class="mentor-company">🏢 ${mentor.company}</div>` : ''}
          <div class="mentor-experience">${mentor.experience} years experience</div>

          ${skills.length > 0 ? `
            <div class="skills-label">Skills</div>
            <div class="skills">
              ${skillsHtml}
            </div>
          ` : ''}

          ${mentor.course ? `
            <div class="courses-label">Teaching</div>
            <div class="courses">${mentor.course}</div>
          ` : ''}

          <div class="mentor-contacts">
            ${contactsHtml}
          </div>
        </div>
      `;

      return card;
    }

    // Load mentors when page loads
    loadMentors();
  </script>
</body>
</html>
