<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Our Mentors | Widgetry Academy</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Unbounded:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'DM Sans', sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
    }

    header {
      text-align: center;
      color: white;
      margin-bottom: 60px;
    }

    header h1 {
      font-family: 'Unbounded', sans-serif;
      font-size: 2.5rem;
      font-weight: 700;
      margin-bottom: 10px;
    }

    header p {
      font-size: 1.1rem;
      opacity: 0.9;
    }

    .mentors-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 30px;
      margin-bottom: 50px;
    }

    .mentor-card {
      background: white;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }

    .mentor-card:hover {
      transform: translateY(-5px);
      box-shadow: 0 15px 40px rgba(0, 0, 0, 0.3);
    }

    .mentor-header {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      padding: 30px 20px;
      text-align: center;
      color: white;
    }

    .mentor-name {
      font-family: 'Unbounded', sans-serif;
      font-size: 1.3rem;
      font-weight: 600;
      margin-bottom: 5px;
    }

    .mentor-title {
      font-size: 0.9rem;
      opacity: 0.9;
    }

    .mentor-body {
      padding: 25px;
    }

    .mentor-company {
      font-size: 0.9rem;
      color: #666;
      margin-bottom: 15px;
      padding-bottom: 15px;
      border-bottom: 1px solid #eee;
    }

    .mentor-experience {
      display: inline-block;
      background: #f0f9ff;
      color: #667eea;
      padding: 5px 12px;
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: 600;
      margin-bottom: 15px;
    }

    .skills-label {
      font-weight: 600;
      color: #333;
      margin-top: 15px;
      margin-bottom: 10px;
      font-size: 0.9rem;
    }

    .skills {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 20px;
    }

    .skill-tag {
      background: #f3f4f6;
      color: #374151;
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 0.8rem;
      font-weight: 500;
    }

    .skill-tag.flutter {
      background: #0553B1;
      color: white;
    }

    .skill-tag.android {
      background: #3DDC84;
      color: white;
    }

    .skill-tag.ios {
      background: #000;
      color: white;
    }

    .skill-tag.web {
      background: #FF9500;
      color: white;
    }

    .skill-tag.backend {
      background: #059669;
      color: white;
    }

    .skill-tag.python {
      background: #3776AB;
      color: white;
    }

    .skill-tag.ui {
      background: #EC4899;
      color: white;
    }

    .skill-tag.cloud {
      background: #4F46E5;
      color: white;
    }

    .courses-label {
      font-weight: 600;
      color: #333;
      margin-bottom: 8px;
      font-size: 0.9rem;
    }

    .courses {
      color: #666;
      font-size: 0.9rem;
      margin-bottom: 20px;
    }

    .mentor-contacts {
      display: flex;
      gap: 12px;
      justify-content: center;
    }

    .contact-link {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: #f0f9ff;
      text-decoration: none;
      transition: background 0.3s;
    }

    .contact-link:hover {
      background: #667eea;
    }

    .contact-link svg {
      width: 20px;
      height: 20px;
      fill: #667eea;
    }

    .contact-link:hover svg {
      fill: white;
    }

    .loading {
      text-align: center;
      color: white;
      font-size: 1.1rem;
      padding: 50px;
    }

    .no-mentors {
      text-align: center;
      color: white;
      background: rgba(255, 255, 255, 0.1);
      padding: 50px;
      border-radius: 12px;
      backdrop-filter: blur(10px);
    }

    .join-banner {
      background: rgba(255, 255, 255, 0.95);
      padding: 40px;
      border-radius: 12px;
      text-align: center;
      margin-bottom: 50px;
    }

    .join-banner h2 {
      font-family: 'Unbounded', sans-serif;
      color: #667eea;
      margin-bottom: 10px;
    }

    .join-banner p {
      color: #666;
      margin-bottom: 20px;
      font-size: 1rem;
    }

    .join-banner a {
      display: inline-block;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      padding: 12px 30px;
      border-radius: 6px;
      text-decoration: none;
      font-weight: 600;
      transition: transform 0.3s;
    }

    .join-banner a:hover {
      transform: scale(1.05);
    }

    @media (max-width: 768px) {
      header h1 {
        font-size: 2rem;
      }

      .mentors-grid {
        grid-template-columns: 1fr;
      }

      .join-banner {
        padding: 25px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>Meet Our Mentors</h1>
      <p>Learn from experienced Flutter developers and industry professionals</p>
    </header>

    <div class="join-banner">
      <h2>Want to Teach?</h2>
      <p>Join our mentor program and earn while sharing your knowledge with the next generation of Flutter developers.</p>
      <a href="/pages/apply-mentor.html">Apply to Become a Mentor</a>
    </div>

    <div class="mentors-grid" id="mentorsContainer">
      <div class="loading">Loading mentors...</div>
    </div>
  </div>

  <!-- Firebase SDK -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js";
    import { getFirestore, collection, query, where, getDocs } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore.js";
    import { firebaseConfig } from "./firebase-config.js";

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    // Escape everything a mentor typed before putting it on the page
    const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    const EXP = { 2: '1–3 years', 4: '3–5 years', 6: '5–8 years', 10: '8–12 years', 15: '12+ years' };
    const expLabel = e => typeof e === 'number' ? (EXP[e] || e + '+ years') : String(e || '');
    const safeUrl = u => /^https?:\/\//i.test(u || '') ? u : '';

    // Approved mentors only. Sorted here, so no Firestore composite index is needed.
    async function loadMentors() {
      const container = document.getElementById('mentorsContainer');
      try {
        const snap = await getDocs(query(collection(db, 'mentorApplications'), where('status', '==', 'approved')));
        const mentors = snap.docs.map(d => d.data())
          .sort((a, b) => (b.adminUpdatedAt?.seconds || 0) - (a.adminUpdatedAt?.seconds || 0));
        container.innerHTML = '';
        if (!mentors.length) {
          container.innerHTML = '<div class="no-mentors" style="grid-column: 1 / -1;">No mentors available yet. Check back soon!</div>';
          return;
        }
        mentors.forEach(m => container.appendChild(createMentorCard(m)));
      } catch (error) {
        console.error('Error loading mentors:', error);
        container.innerHTML = '<div class="no-mentors" style="grid-column: 1 / -1;">Error loading mentors. Please try again later.</div>';
      }
    }

    // Public card: no email or phone number, only professional details and LinkedIn
    function createMentorCard(mentor) {
      const card = document.createElement('div');
      card.className = 'mentor-card';
      const skills = Array.isArray(mentor.skills) ? mentor.skills : [];
      const exp = expLabel(mentor.experience);
      const li = safeUrl(mentor.linkedin);
      card.innerHTML = `
        <div class="mentor-header">
          <div class="mentor-name">${esc(mentor.name)}</div>
          <div class="mentor-title">${esc(mentor.role)}</div>
        </div>
        <div class="mentor-body">
          ${mentor.company ? `<div class="mentor-company">🏢 ${esc(mentor.company)}</div>` : ''}
          ${exp ? `<div class="mentor-experience">${esc(exp)} experience</div>` : ''}
          ${skills.length ? `<div class="skills-label">Skills</div><div class="skills">${skills.map(s => `<span class="skill-tag ${esc(String(s).toLowerCase())}">${esc(s)}</span>`).join('')}</div>` : ''}
          ${mentor.course ? `<div class="courses-label">Teaching</div><div class="courses">${esc(mentor.course)}</div>` : ''}
          ${li ? `<div class="mentor-contacts">
            <a href="${esc(li)}" target="_blank" rel="noopener" class="contact-link" title="LinkedIn">
              <svg viewBox="0 0 24 24"><path d="M19 3a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h14m-.5 15.5v-5.3a3.26 3.26 0 0 0-3.26-3.26c-.85 0-1.84.52-2.32 1.39v-1.2h-2.84v8.37h2.84v-4.93c0-.77.62-1.4 1.39-1.4a1.4 1.4 0 0 1 1.4 1.4v4.93h2.84M6.88 8.56a1.68 1.68 0 0 0 1.68-1.68c0-.93-.75-1.69-1.68-1.69a1.69 1.69 0 0 0-1.69 1.69c0 .93.76 1.68 1.69 1.68m1.39 9.94v-8.37H5.5v8.37h2.77z"/></svg>
            </a></div>` : ''}
        </div>`;
      return card;
    }

    loadMentors();
  </script>
</body>
</html>
