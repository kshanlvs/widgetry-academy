<!doctype html>
<html lang="en"><head><meta charset="utf-8"><script>(function(h){if(h==="widgetry-academy.web.app"||h==="widgetry-academy.firebaseapp.com"||h==="www.widgetryacademy.in"){location.replace("https://widgetryacademy.in"+location.pathname+location.search+location.hash)}})(location.hostname)</script><meta name="viewport" content="width=device-width, initial-scale=1">
<title>My resume | Widgetry Jobs</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700;9..40,800&display=swap">
<style>
:root{--ink:#14201b;--muted:#5b6b63;--line:#dde5e0;--accent:#0f6b56;--bg:#eef2ef;--paper:#fff}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 "DM Sans",system-ui,sans-serif}
.bar{position:sticky;top:0;z-index:2;background:#0c2a23;color:#eaf3ee}
.bar .in{max-width:860px;margin:auto;padding:10px 16px;display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.bar a,.bar button{font:600 14px "DM Sans",sans-serif;border-radius:999px;padding:9px 16px;text-decoration:none;cursor:pointer;border:1.5px solid #2c5a4c;color:#eaf3ee;background:transparent}
.bar .primary{background:#3fc79f;border-color:#3fc79f;color:#04130e}
.bar .acts{display:flex;gap:8px;flex-wrap:wrap}
.tip{max-width:860px;margin:14px auto 0;padding:0 16px;color:var(--muted);font-size:13.5px}
.page{max-width:820px;margin:14px auto 40px;background:var(--paper);padding:44px 48px;box-shadow:0 1px 3px rgba(0,0,0,.08),0 10px 30px rgba(0,0,0,.06);border-radius:6px}
.msg{max-width:560px;margin:60px auto;text-align:center;padding:0 16px}
.msg a{color:var(--accent);font-weight:700}
h1{font-size:30px;line-height:1.15;margin:0;letter-spacing:-.01em}
.head{border-bottom:2px solid var(--accent);padding-bottom:14px;margin-bottom:6px}
.headline{font-size:16px;font-weight:600;color:var(--accent);margin-top:4px}
.contact{display:flex;flex-wrap:wrap;gap:4px 14px;margin-top:10px;font-size:13.5px;color:var(--muted)}
.contact a{color:inherit;text-decoration:none}
.verified{display:inline-block;margin-left:8px;vertical-align:middle;font-size:11.5px;font-weight:700;color:var(--accent);border:1.5px solid var(--accent);border-radius:999px;padding:2px 9px;letter-spacing:.02em}
section{margin-top:18px;break-inside:auto}
h2{font-size:12.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--accent);margin:0 0 8px;font-weight:800}
.summary{margin:0;white-space:pre-line}
.skills{display:flex;flex-wrap:wrap;gap:6px}
.skills span{border:1px solid var(--line);border-radius:6px;padding:2px 9px;font-size:13.5px;font-weight:500}
.item{margin-bottom:12px;break-inside:avoid}
.item .top{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
.item b{font-size:15.5px}
.item .when{color:var(--muted);font-size:13.5px;white-space:nowrap}
.item .sub{color:var(--muted);font-size:14px}
.item .sub a{color:inherit}
.item ul{margin:6px 0 0;padding-left:18px}
.item li{margin:2px 0}
.foot{margin-top:26px;font-size:11.5px;color:#9aa7a0;text-align:right}
@media (max-width:640px){.page{padding:26px 18px;margin:10px 8px 30px}h1{font-size:25px}}
@page{size:A4;margin:13mm 14mm}
@media print{
  body{background:#fff;font-size:12.5pt}
  .bar,.tip{display:none}
  .page{box-shadow:none;margin:0;padding:0;max-width:none;border-radius:0}
  a{color:inherit}
}
</style>
</head><body>
<div class="bar"><div class="in">
  <a href="talent.html">← Edit profile</a>
  <div class="acts"><button type="button" id="bPrint" class="primary" hidden>Download PDF</button></div>
</div></div>
<p class="tip" id="tip" hidden>Built automatically from your Talent Network profile. To change anything, edit your profile and come back. In the print window choose <b>Save as PDF</b>.</p>
<div id="root"><p class="msg">Loading your resume…</p></div>

<script type="module">
import { $, esc, api, onUser, LABEL } from "./jobs.js";

const TOP = { Flutter: 2, Dart: 1 };   // Flutter and Dart lead the skills list
const MONTHS = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const ym = v => { if (!v) return "Present"; const [y, m] = v.split("-"); return `${MONTHS[Number(m) - 1]} ${y}`; };
const safe = u => /^https?:\/\//i.test(u || "") ? u : "";
const short = u => u.replace(/^https?:\/\/(www\.)?/i, "").replace(/\/$/, "");
const lines = t => String(t || "").split(/\n+/).map(s => s.replace(/^\s*[-•*]\s*/, "").trim()).filter(Boolean);

function render(p) {
  const contact = [
    p.email && `<a href="mailto:${esc(p.email)}">${esc(p.email)}</a>`,
    p.phone && `<span>${esc(p.phone)}</span>`,
    p.city && `<span>${esc(p.city)}, India</span>`,
    ...[p.githubUrl, p.linkedinUrl, p.portfolioUrl].filter(safe).map(u => `<a href="${esc(u)}">${esc(short(u))}</a>`),
  ].filter(Boolean).join("");
  const badge = p.verification === "verified" ? `<span class="verified">★ Widgetry verified</span>` : p.verification === "portfolio" ? `<span class="verified">✓ Portfolio checked</span>` : "";

  const work = (p.experience || []).map(w => `<div class="item"><div class="top"><div><b>${esc(w.role)}</b><div class="sub">${esc(w.company)}</div></div><span class="when">${ym(w.start)} – ${ym(w.end)}</span></div>
    ${lines(w.points).length ? `<ul>${lines(w.points).map(l => `<li>${esc(l)}</li>`).join("")}</ul>` : ""}</div>`).join("");
  // No work history yet: still show the current company the person entered
  const workFallback = !work && p.currentCompany ? `<div class="item"><div class="top"><div><b>${esc(p.headline)}</b><div class="sub">${esc(p.currentCompany)}</div></div><span class="when">Present</span></div></div>` : "";

  const apps = (p.apps || []).map(a => `<div class="item"><div class="top"><div><b>${esc(a.name)}</b>${a.role ? `<span class="sub"> · ${esc(a.role)}</span>` : ""}</div></div>
    ${safe(a.url) ? `<div class="sub"><a href="${esc(a.url)}">${esc(short(a.url))}</a></div>` : ""}</div>`).join("");

  const edu = (p.education || []).map(e => `<div class="item"><div class="top"><div><b>${esc(e.degree)}</b><div class="sub">${esc(e.institute)}${e.score ? ` · ${esc(e.score)}` : ""}</div></div>${e.year ? `<span class="when">${esc(e.year)}</span>` : ""}</div></div>`).join("");

  const prefs = [p.jobTypes?.map(t => LABEL.type[t]).join(", "), p.workModes?.map(m => LABEL.mode[m]).join(" / "), p.noticePeriod && "Notice: " + LABEL.notice[p.noticePeriod]].filter(Boolean).join(" · ");
  const yrs = Number(p.experienceYears) > 0 ? `${p.experienceYears} year${p.experienceYears == 1 ? "" : "s"} of Flutter experience. ` : "";

  $("root").innerHTML = `<article class="page">
    <header class="head"><h1>${esc(p.fullName)}${badge}</h1><div class="headline">${esc(p.headline)}</div><div class="contact">${contact}</div></header>
    ${p.about || yrs ? `<section><h2>Summary</h2><p class="summary">${esc(yrs)}${esc(p.about || "")}</p></section>` : ""}
    ${p.skills?.length ? `<section><h2>Skills</h2><div class="skills">${[...p.skills].sort((a, b) => (TOP[b] || 0) - (TOP[a] || 0)).map(s => `<span>${esc(s)}</span>`).join("")}</div></section>` : ""}
    ${work || workFallback ? `<section><h2>Experience</h2>${work || workFallback}</section>` : ""}
    ${apps ? `<section><h2>Apps &amp; projects</h2>${apps}</section>` : ""}
    ${edu ? `<section><h2>Education</h2>${edu}</section>` : ""}
    ${prefs ? `<section><h2>Looking for</h2><p class="summary">${esc(prefs)}</p></section>` : ""}
    <p class="foot">Resume created with Widgetry Jobs · widgetryacademy.in/jobs</p>
  </article>`;
  document.title = `${p.fullName} - Flutter Developer Resume`;   // becomes the PDF file name
  $("bPrint").hidden = false; $("tip").hidden = false;
}

onUser(async u => {
  if (!u) { $("root").innerHTML = `<p class="msg">Please <a href="talent.html">sign in and create your profile</a> to get your resume.</p>`; return; }
  try {
    const r = await api("/talent/me", { auth: true });
    if (!r.profile) { $("root").innerHTML = `<p class="msg">You don't have a profile yet. <a href="talent.html">Create your Talent Network profile</a> and your resume is built automatically.</p>`; return; }
    render(r.profile);
  } catch (e) { $("root").innerHTML = `<p class="msg">${esc(e.message)}</p>`; }
});
$("bPrint").onclick = () => print();
</script>
</body></html>
