<!doctype html>
<html lang="en"><head><meta charset="utf-8"><script>(function(h){if(h==="widgetry-academy.web.app"||h==="widgetry-academy.firebaseapp.com"||h==="www.widgetryacademy.in"){location.replace("https://widgetryacademy.in"+location.pathname+location.search+location.hash)}})(location.hostname)</script><meta name="viewport" content="width=device-width, initial-scale=1">
<title>My resume | Widgetry Jobs</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,500;0,8..60,600;0,8..60,700;1,8..60,400;1,8..60,500&display=swap">
<style>
:root{--ink:#14201b;--muted:#5b6b63;--line:#dde5e0;--accent:#0f6b56;--bg:#eef2ef}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 "DM Sans",system-ui,sans-serif}
.bar{position:sticky;top:0;z-index:2;background:#0c2a23;color:#eaf3ee}
.bar .in{max-width:1100px;margin:auto;padding:10px 16px;display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.bar a,.bar button{font:600 14px "DM Sans",sans-serif;border-radius:999px;padding:9px 16px;text-decoration:none;cursor:pointer;border:1.5px solid #2c5a4c;color:#eaf3ee;background:transparent}
.bar .primary{background:#3fc79f;border-color:#3fc79f;color:#04130e}
.seg{display:inline-flex;border:1.5px solid #2c5a4c;border-radius:999px;padding:3px;gap:2px}
.seg button{border:0;padding:6px 13px;font-size:13.5px}
.seg button[aria-pressed="true"]{background:#eaf3ee;color:#0c2a23}
.layout{max-width:1100px;margin:18px auto 50px;padding:0 16px;display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:20px;align-items:start}
.paper{background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.08),0 12px 34px rgba(0,0,0,.08);border-radius:4px;padding:15mm 15mm 18mm;min-height:297mm;max-width:210mm;width:100%;justify-self:center}
.side{position:sticky;top:76px;display:grid;gap:14px}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px}
.card h3{margin:0 0 8px;font-size:15px}
.meter{height:9px;border-radius:9px;background:#e4ebe7;overflow:hidden;margin:8px 0}
.meter i{display:block;height:100%;background:linear-gradient(90deg,#f2a900,#0f6b56);border-radius:9px}
.score{font-size:28px;font-weight:800;line-height:1}
.tips{margin:8px 0 0;padding-left:18px;font-size:13.5px;color:var(--muted)}
.tips li{margin:4px 0}
.small{font-size:13px;color:var(--muted);margin:0}
.card a{color:var(--accent);font-weight:700}
.fld{display:grid;gap:6px;font-weight:700;font-size:14px;margin-bottom:12px}
.fld input:not([type]){font:inherit;font-weight:500;padding:9px 11px;border:1.5px solid var(--line);border-radius:10px}
.fld .small{font-weight:500}
.sw{display:flex;gap:8px;flex-wrap:wrap}
.sw button{width:28px;height:28px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 1.5px var(--line);cursor:pointer}
.sw button[aria-pressed="true"]{box-shadow:0 0 0 2.5px var(--ink)}
.tg{display:grid;grid-template-columns:1fr 1fr;gap:6px 10px;font-weight:500}
.tg label{display:flex;gap:7px;align-items:center;cursor:pointer}
.tg .dis{opacity:.5;cursor:not-allowed}
.msg{max-width:560px;margin:60px auto;text-align:center;padding:0 16px}
.msg a{color:var(--accent);font-weight:700}
@media (max-width:900px){.layout{grid-template-columns:1fr}.side{position:static;order:-1}.paper{padding:22px 18px;min-height:0}}
@page{size:A4;margin:12mm 14mm}
@media print{
  body{background:#fff}
  .bar,.side{display:none!important}
  .layout{display:block;margin:0;padding:0;max-width:none}
  .paper{box-shadow:none;padding:0;min-height:0;max-width:none;border-radius:0}
}
</style>
<style id="resumeCss"></style>
</head><body>
<div class="bar"><div class="in">
  <a href="my-profile.html">← My profile</a>
  <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap">
    <div class="seg" id="tpl" role="group" aria-label="Resume style" hidden></div>
    <button type="button" id="bPrint" class="primary" hidden>Download PDF</button>
  </div>
</div></div>
<div id="root"><p class="msg">Loading your resume…</p></div>

<script type="module">
import { $, esc, api, onUser } from "./jobs.js";
import { renderResume, strength, TEMPLATES, RESUME_CSS, ACCENTS } from "./resume-render.js";
$("resumeCss").textContent = RESUME_CSS;

let profile = null;
let st = { template: "modern", accent: "green", title: "", showPhoto: false, hide: [] };
const TOGGLES = [["photo", "Photo"], ["phone", "Phone"], ["email", "Email"], ["city", "City"], ["summary", "Summary"], ["projects", "Projects"], ["education", "Education"], ["certifications", "Certifications"]];

function drawTpl() {
  $("tpl").innerHTML = Object.entries(TEMPLATES).map(([k, v]) => `<button type="button" data-t="${k}" aria-pressed="${k === st.template}">${v}</button>`).join("");
  $("tpl").querySelectorAll("button").forEach(b => b.onclick = () => { st.template = b.dataset.t; changed(); });
}

let saveT = null;
// Clicks save straight away; typing waits until the person pauses
function changed(redraw = true) { drawTpl(); drawPaper(); if (redraw) drawCustom(); $("saveState").textContent = "Saving…"; clearTimeout(saveT); saveT = setTimeout(save, redraw ? 0 : 600); }
async function save() {
  try { await api("/talent/me/resume-settings", { method: "PUT", body: { ...st, title: st.title || "" }, auth: true }); $("saveState").textContent = "Saved to your account ✓"; }
  catch (x) { $("saveState").textContent = x.message; }
}

function drawPaper() {
  const opts = { ...st, showPhoto: st.showPhoto };
  $("paper").innerHTML = renderResume(profile, st.template, opts);
  const s = strength(profile);
  const label = s.score >= 85 ? "Excellent" : s.score >= 65 ? "Good" : s.score >= 45 ? "Getting there" : "Needs work";
  $("strength").innerHTML = `<h3>Resume strength</h3><div style="display:flex;align-items:baseline;gap:8px"><span class="score">${s.score}</span><span class="small">/ 100 · ${label}</span></div>
    <div class="meter"><i style="width:${s.score}%"></i></div>
    ${s.tips.length ? `<ul class="tips">${s.tips.slice(0, 4).map(t => `<li>${esc(t)}</li>`).join("")}</ul><p class="small" style="margin-top:10px"><a href="talent.html?edit=1">Improve it in your profile →</a></p>` : `<p class="small">Everything recruiters look for is here. Nice work.</p>`}`;
}

function drawCustom() {
  const hidden = new Set(st.hide);
  $("custom").innerHTML = `<h3>Customize</h3>
    <label class="fld">Target job title <span class="small">(shown under your name)</span><input id="cTitle" maxlength="140" placeholder="${esc(profile.headline)}" value="${esc(st.title || "")}"></label>
    <div class="fld">Colour ${st.template === "classic" ? `<span class="small">(line under your name)</span>` : ""}<div class="sw">${Object.entries(ACCENTS).map(([k, c]) => `<button type="button" data-a="${k}" aria-label="${k}" aria-pressed="${k === st.accent}" style="background:${c}"></button>`).join("")}</div></div>
    <div class="fld">Show on resume<div class="tg">${TOGGLES.map(([k, l]) => {
      const on = k === "photo" ? st.showPhoto && !hidden.has("photo") : !hidden.has(k);
      const dis = k === "photo" && !profile.photo;
      return `<label class="${dis ? "dis" : ""}"><input type="checkbox" data-k="${k}" ${on && !dis ? "checked" : ""} ${dis ? "disabled" : ""}> ${l}</label>`;
    }).join("")}</div>
    ${!profile.photo ? `<p class="small" style="margin:6px 0 0"><a href="my-profile.html">Add a photo</a> to use it here.</p>` : `<p class="small" style="margin:6px 0 0">Tip: most Indian IT companies and ATS don't need a photo. Leave it off unless asked.</p>`}</div>
    <p class="small" id="saveState" style="margin:4px 0 0">${$("saveState")?.textContent || "Changes save to your account automatically."}</p>`;
  $("cTitle").oninput = e => { st.title = e.target.value; changed(false); };
  $("custom").querySelectorAll("[data-a]").forEach(b => b.onclick = () => { st.accent = b.dataset.a; changed(); });
  $("custom").querySelectorAll("[data-k]").forEach(c => c.onchange = () => {
    const k = c.dataset.k;
    if (k === "photo") { st.showPhoto = c.checked; st.hide = st.hide.filter(x => x !== "photo"); }
    else st.hide = c.checked ? st.hide.filter(x => x !== k) : [...new Set([...st.hide, k])];
    changed();
  });
}

onUser(async u => {
  if (!u) { $("root").innerHTML = `<p class="msg">Please <a href="talent.html">sign in and create your profile</a> to get your resume.</p>`; return; }
  try {
    const r = await api("/talent/me", { auth: true });
    if (!r.profile) { $("root").innerHTML = `<p class="msg">You don't have a profile yet. <a href="talent.html">Create your profile</a> and your resume is built automatically.</p>`; return; }
    profile = r.profile;
    st = { ...st, ...(profile.resumeSettings || {}) };
    st.title = st.title || "";
    if (!TEMPLATES[st.template]) st.template = "modern";
    document.title = `${profile.fullName} - Flutter Developer Resume`;   // becomes the PDF file name
    $("root").innerHTML = `<div class="layout"><div class="paper" id="paper"></div>
      <aside class="side"><div class="card" id="custom"></div><div class="card" id="strength"></div>
        <div class="card"><h3>Saving the PDF</h3><p class="small">Click <b>Download PDF</b>, choose <b>Save as PDF</b>, and turn off <b>Headers and footers</b> under More settings. ATS-friendly: one column, real text, standard headings.</p></div></aside></div>`;
    $("tpl").hidden = false; $("bPrint").hidden = false; drawTpl(); drawPaper(); drawCustom();
  } catch (e) { $("root").innerHTML = `<p class="msg">${esc(e.message)}</p>`; }
});
$("bPrint").onclick = () => print();
</script>
</body></html>
