<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><script>(function(h){if(h==="widgetry-academy.web.app"||h==="widgetry-academy.firebaseapp.com"||h==="www.widgetryacademy.in"){location.replace("https://widgetryacademy.in"+location.pathname+location.search+location.hash)}})(location.hostname)</script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard | Widgetry Academy</title>
  <meta name="robots" content="noindex">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;800&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=JetBrains+Mono:wght@400;600&display=swap">
  <link rel="stylesheet" href="../styles/base.css">
  <link rel="stylesheet" href="../styles/components.css">
  <style>
    .dashboard-header { background: var(--deep); color: var(--deep-fg); padding-block: var(--sp-2xl); border-bottom: 1px solid var(--deep-line); }
    .dashboard-header .wrap { display: flex; align-items: center; justify-content: space-between; gap: var(--sp-lg); }
    .user-greeting h1 { color: var(--deep-fg); margin-bottom: var(--sp-sm); }
    .user-greeting p { color: var(--deep-muted); }
    .user-menu { display: flex; gap: var(--sp-md); align-items: center; flex-wrap: wrap; flex-shrink: 0; }
    .user-menu .btn { background: var(--accent); color: var(--accent-ink); border-color: transparent; }
    .dashboard-content { padding-block: var(--sp-2xl); }

    .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: var(--sp-lg); margin-bottom: var(--sp-2xl); }
    .stat-card { background: var(--surface); border-radius: var(--radius-md); padding: var(--sp-lg); border: 1px solid var(--line); }
    .stat-label { color: var(--muted); font-size: 13px; font-weight: 600; text-transform: uppercase; letter-spacing: .08em; margin-bottom: var(--sp-sm); }
    .stat-value { font-family: var(--display); font-size: 28px; font-weight: 700; color: var(--accent); }

    .section { margin-bottom: var(--sp-3xl); }
    .section-title { font-size: 24px; font-weight: 700; margin-bottom: var(--sp-lg); padding-bottom: var(--sp-md); border-bottom: 2px solid var(--line); }

    .courses { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: var(--sp-lg); }
    .course { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-md); padding: var(--sp-lg); display: flex; flex-direction: column; gap: var(--sp-md); }
    .course h3 { margin: 0; font-size: 19px; }
    .course .meta { color: var(--muted); font-size: 14px; display: flex; flex-direction: column; gap: 4px; }
    .course .actions { display: flex; gap: var(--sp-sm); flex-wrap: wrap; margin-top: auto; }

    .pill { display: inline-block; font-size: 12px; font-weight: 700; padding: 3px 10px; border-radius: 999px; text-transform: uppercase; letter-spacing: .05em; width: fit-content; }
    .pill.ok { background: color-mix(in srgb, var(--ok) 15%, transparent); color: var(--ok); }
    .pill.warn { background: color-mix(in srgb, var(--warn) 15%, transparent); color: var(--warn); }
    .pill.muted { background: var(--soft); color: var(--muted); }

    .orders { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-md); overflow: hidden; }
    .order { display: grid; grid-template-columns: 1fr auto auto; gap: var(--sp-md); align-items: center; padding: var(--sp-md) var(--sp-lg); border-top: 1px solid var(--line); }
    .order:first-child { border-top: 0; }
    .order .what b { display: block; }
    .order .what span { color: var(--muted); font-size: 14px; }
    .order .amt { font-weight: 700; text-align: right; white-space: nowrap; }
    .order .amt .pill { display: block; margin: 4px 0 0 auto; }

    .empty { text-align: center; padding: var(--sp-2xl); background: var(--surface); border: 1px dashed var(--line); border-radius: var(--radius-md); color: var(--muted); }
    .empty b { display: block; color: var(--ink); font-size: 18px; margin-bottom: var(--sp-sm); }
    .loading { color: var(--muted); }

    @media (max-width: 768px) {
      .dashboard-header .wrap { flex-direction: column; align-items: flex-start; }
      .user-menu { width: 100%; }
      .order { grid-template-columns: 1fr auto; }
      .order .receipt { grid-column: 1 / -1; }
    }
  </style>
</head>
<body>
  <header class="dashboard-header">
    <div class="wrap">
      <div class="user-greeting">
        <h1>Welcome back, <span id="userName">there</span>! 👋</h1>
        <p id="userEmail"></p>
      </div>
      <div class="user-menu">
        <a href="../pages/apply-mentor.html" class="btn ghost" id="mentorBtn" hidden>🎓 Edit mentor profile</a>
        <a href="../pages/profile.html" class="btn ghost">📝 Edit profile</a>
        <button id="logoutBtn" class="btn ghost">🚪 Logout</button>
      </div>
    </div>
  </header>

  <main class="dashboard-content">
    <div class="wrap">
      <div class="stats">
        <div class="stat-card"><div class="stat-label">Courses enrolled</div><div class="stat-value" id="enrolledCount">–</div></div>
        <div class="stat-card"><div class="stat-label">Total paid</div><div class="stat-value" id="amountPaid">–</div></div>
        <div class="stat-card"><div class="stat-label">Orders</div><div class="stat-value" id="orderCount">–</div></div>
      </div>

      <section class="section">
        <h2 class="section-title">📚 My courses</h2>
        <div id="courses" class="courses"><p class="loading">Loading your courses…</p></div>
      </section>

      <section class="section" id="orders-section">
        <h2 class="section-title">🧾 Orders &amp; receipts</h2>
        <div id="orders"><p class="loading">Loading your orders…</p></div>
      </section>
    </div>
  </main>

  <script src="../site-config.js"></script>
  <script type="module">
    import { onAuthReady, logoutUser } from '../js/auth.js';
    import { showToast } from '../js/ui.js';
    import { JOBS_API } from '../jobs-api-url.js';

    const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    const inr = n => '₹' + Number(n || 0).toLocaleString('en-IN');
    const day = iso => iso ? new Date(iso).toLocaleDateString('en-IN', { day: 'numeric', month: 'short', year: 'numeric' }) : '';
    const dayTime = iso => iso ? new Date(iso).toLocaleString('en-IN', { weekday: 'short', day: 'numeric', month: 'short', hour: 'numeric', minute: '2-digit' }) : '';
    // Links from the server are site paths ("/bloc-crash-course.html") or https URLs; nothing else is used as a link
    const safeUrl = u => (typeof u === 'string' && (/^https:\/\//i.test(u) || /^\/(?!\/)/.test(u))) ? u : null;

    const COURSE_STATUS = {
      enrolled:   ['ok', 'Enrolled'],
      booked:     ['warn', 'Seat booked · balance due'],
      registered: ['warn', 'Registered · not paid yet'],
      refunded:   ['muted', 'Refunded'],
    };
    const ORDER_STATUS = {
      paid:           ['ok', 'Paid'],
      refunded:       ['muted', 'Refunded'],
      refund_pending: ['warn', 'Refund on its way'],
    };
    const pill = (map, s) => { const [cls, label] = map[s] || ['muted', s]; return `<span class="pill ${cls}">${esc(label)}</span>`; };

    function renderCourses(courses) {
      const el = document.getElementById('courses');
      document.getElementById('enrolledCount').textContent = courses.filter(c => c.status === 'enrolled' || c.status === 'booked').length;
      if (!courses.length) {
        el.outerHTML = `<div class="empty"><b>No courses yet</b>Pick a course to get started.<br><br><a class="btn" href="/#courses">Browse courses</a></div>`;
        return;
      }
      el.innerHTML = courses.map(c => {
        const when = c.startsAt ? `📅 Starts ${esc(dayTime(c.startsAt))}` : '';
        const page = safeUrl(c.webPath), brochure = safeUrl(c.brochureUrl), meet = safeUrl(c.meetingLink);
        const unpaid = c.status === 'registered' || c.status === 'booked';
        return `<article class="course">
          ${pill(COURSE_STATUS, c.status)}
          <h3>${esc(c.title)}</h3>
          <div class="meta">
            ${when ? `<span>${when}</span>` : ''}
            ${c.schedule ? `<span>🕒 ${esc(c.schedule)}</span>` : ''}
            ${c.amountPaid ? `<span>💳 Paid ${inr(c.amountPaid)}</span>` : ''}
          </div>
          <div class="actions">
            ${meet ? `<a class="btn small" href="${esc(meet)}" target="_blank" rel="noopener">Join class</a>` : ''}
            ${unpaid && page ? `<a class="btn small" href="${esc(page)}">${c.status === 'booked' ? 'Pay balance' : 'Complete payment'}</a>` : ''}
            ${page && !unpaid ? `<a class="btn small ghost" href="${esc(page)}">Course page</a>` : ''}
            ${brochure ? `<a class="btn small ghost" href="${esc(brochure)}" target="_blank" rel="noopener">Brochure</a>` : ''}
          </div>
        </article>`;
      }).join('');
    }

    function renderOrders(orders) {
      const el = document.getElementById('orders');
      document.getElementById('orderCount').textContent = orders.length;
      document.getElementById('amountPaid').textContent = inr(orders.filter(o => o.status === 'paid').reduce((s, o) => s + o.amount, 0));
      if (!orders.length) {
        el.innerHTML = `<div class="empty"><b>No orders yet</b>Everything you buy, with its receipt, shows up here.</div>`;
        return;
      }
      el.innerHTML = `<div class="orders">${orders.map(o => `
        <div class="order">
          <div class="what"><b>${esc(o.title)}</b><span>${esc(o.item)} · ${esc(day(o.paidAt))}</span></div>
          <div class="amt">${inr(o.amount)}${pill(ORDER_STATUS, o.status)}</div>
          <a class="btn small ghost receipt" href="receipt.html?id=${encodeURIComponent(o.id)}">Receipt</a>
        </div>`).join('')}</div>`;
    }

    onAuthReady().then(async user => {
      if (!user) { location.href = '../pages/login.html?next=' + encodeURIComponent(location.pathname); return; }
      document.getElementById('userName').textContent = (user.displayName || '').split(' ')[0] || 'there';
      document.getElementById('userEmail').textContent = user.email || '';
      const headers = { authorization: 'Bearer ' + (await user.getIdToken()) };

      // Mentors get a shortcut to edit their mentor profile
      fetch(JOBS_API + '/mentor/me', { headers }).then(r => r.ok ? r.json() : null)
        .then(d => { if (d && d.application) document.getElementById('mentorBtn').hidden = false; }).catch(() => {});

      try {
        const r = await fetch(JOBS_API + '/me/purchases', { headers });
        if (!r.ok) throw new Error('HTTP ' + r.status);
        const { courses = [], orders = [] } = await r.json();
        renderCourses(courses);
        renderOrders(orders);
      } catch (e) {
        console.error('Could not load purchases', e);
        const msg = `<div class="empty"><b>Couldn't load this right now</b>Check your connection and refresh. Your purchases are safe.</div>`;
        document.getElementById('courses').outerHTML = msg;
        document.getElementById('orders').innerHTML = msg;
      }
    });

    document.getElementById('logoutBtn').addEventListener('click', async () => {
      try {
        await logoutUser();
        location.href = '../index.html';
      } catch (_) { showToast('Logout failed, please try again', 'error'); }
    });
  </script>
</body>
</html>
