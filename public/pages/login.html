<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | Widgetry Academy</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;800&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=JetBrains+Mono:wght@400;600&display=swap">
  <link rel="stylesheet" href="../styles/base.css">
  <link rel="stylesheet" href="../styles/components.css">
  <style>
    body {
      background: linear-gradient(135deg, var(--deep) 0%, var(--deep-2) 100%);
    }

    section {
      padding-block: var(--sp-3xl);
    }

    .login-container {
      max-width: 450px;
      margin: 0 auto;
      padding: var(--sp-md);
    }

    .login-card {
      background: var(--surface);
      border-radius: var(--radius-lg);
      padding: var(--sp-2xl);
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
    }

    .login-header {
      text-align: center;
      margin-bottom: var(--sp-2xl);
    }

    .login-header h1 {
      color: var(--deep);
      margin-bottom: var(--sp-sm);
    }

    .login-header p {
      color: var(--muted);
    }

    .login-form {
      display: flex;
      flex-direction: column;
      gap: var(--sp-md);
    }

    .form-submit {
      margin-top: var(--sp-lg);
    }

    .forgot-password {
      text-align: right;
      margin-top: var(--sp-md);
    }

    .forgot-password a {
      font-size: 14px;
      color: var(--accent);
      text-decoration: none;
    }

    .forgot-password a:hover {
      text-decoration: underline;
    }

    .signup-link {
      text-align: center;
      margin-top: var(--sp-lg);
      padding-top: var(--sp-lg);
      border-top: 1px solid var(--line);
      font-size: 14px;
      color: var(--muted);
    }

    .signup-link a {
      color: var(--accent);
      font-weight: 600;
      text-decoration: none;
    }

    .signup-link a:hover {
      text-decoration: underline;
    }

    .loading-state {
      display: none;
      align-items: center;
      justify-content: center;
      gap: var(--sp-md);
      color: var(--muted);
    }

    .divider {
      display: flex;
      align-items: center;
      gap: var(--sp-md);
      margin: var(--sp-lg) 0;
      color: var(--muted);
      font-size: 14px;
    }

    .divider::before,
    .divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--line);
    }
  </style>
</head>
<body>
  <section>
    <div class="login-container">
      <div class="login-card">
        <div class="login-header">
          <h1>👋 Welcome Back</h1>
          <p>Log in to your Widgetry Academy account</p>
        </div>

        <form class="login-form" id="loginForm">
          <div class="form-group">
            <label for="email">Email Address</label>
            <input type="email" id="email" name="email" required placeholder="your@email.com">
            <div class="form-error"></div>
          </div>

          <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" required placeholder="••••••••">
            <div class="form-error"></div>
          </div>

          <div class="forgot-password">
            <a href="../pages/reset-password.html">Forgot password?</a>
          </div>

          <div class="form-submit">
            <button type="submit" class="btn large" style="width: 100%;">
              Log In
            </button>

            <div class="loading-state" id="loadingState">
              <div class="spinner"></div>
              <span>Logging in...</span>
            </div>
          </div>
        </form>

        <div class="signup-link">
          New to Widgetry Academy? <a href="../pages/register.html">Sign up now</a>
        </div>
      </div>
    </div>
  </section>

  <script type="module">
    import { loginUser, onAuthReady } from '../js/auth.js';
    import { showToast, showFormError, clearFormError, validateEmail, setButtonDisabled } from '../js/ui.js';

    // Check if already logged in
    onAuthReady().then(user => {
      if (user) {
        window.location.href = '../pages/dashboard.html';
      }
    });

    const form = document.getElementById('loginForm');
    const submitBtn = form.querySelector('button[type="submit"]');
    const loadingState = document.getElementById('loadingState');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();

      // Clear previous errors
      document.querySelectorAll('.form-group').forEach(group => clearFormError(group));

      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;

      // Validation
      let hasError = false;

      if (!validateEmail(email)) {
        showFormError(document.getElementById('email').parentElement, 'Please enter a valid email');
        hasError = true;
      }

      if (!password) {
        showFormError(document.getElementById('password').parentElement, 'Please enter your password');
        hasError = true;
      }

      if (hasError) return;

      try {
        setButtonDisabled(submitBtn, true);
        submitBtn.style.display = 'none';
        loadingState.style.display = 'flex';

        await loginUser(email, password);

        showToast('✓ Logged in successfully! Redirecting...', 'success', 1500);

        // Redirect to dashboard
        setTimeout(() => {
          window.location.href = '../pages/dashboard.html';
        }, 1500);
      } catch (error) {
        console.error('Login error:', error);
        showToast(`✗ ${error.message}`, 'error', 5000);
        setButtonDisabled(submitBtn, false);
        submitBtn.style.display = 'block';
        loadingState.style.display = 'none';
      }
    });
  </script>
</body>
</html>
