<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><script>(function(h){if(h==="widgetry-academy.web.app"||h==="widgetry-academy.firebaseapp.com"||h==="www.widgetryacademy.in"){location.replace("https://widgetryacademy.in"+location.pathname+location.search+location.hash)}})(location.hostname)</script>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Verified Flutter Badge | Widgetry Academy Exam Center</title>
<meta name="description" content="A verified Flutter badge from the Widgetry Academy Exam Center: the name, level, score and date are checked against our records.">
<meta name="robots" content="noindex">
<meta property="og:type" content="website"><meta property="og:site_name" content="Widgetry Academy">
<meta property="og:title" content="Verified Flutter badge · Widgetry Academy">
<meta property="og:description" content="Earned in the Widgetry Flutter Exam Center. Open to verify the name, level, score and date.">
<meta property="og:image" content="https://widgetryacademy.in/og-image.jpg">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@600;700;800&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
:root{--bg:#f3f6f4;--ink:#0e1f1a;--muted:#4f6359;--line:#d8e2dc;--accent:#0f6b56;--gold:#f2a900;--deep:#0c2a23;--deep-line:#245446;--deep-fg:#eaf3ee;--deep-muted:#b3cbbf;--soft:#e3efe9;
  --display:"Unbounded","Segoe UI",system-ui,sans-serif;--body:"DM Sans","Segoe UI",system-ui,sans-serif;--mono:"JetBrains Mono",ui-monospace,monospace;color-scheme:light}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.6}
a{color:var(--accent)}
.w{max-width:1000px;margin:0 auto;padding:0 20px}
h1,h2{font-family:var(--display);letter-spacing:-.02em;line-height:1.15}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--accent);color:#fff;padding:13px 22px;border-radius:12px;text-decoration:none;border:0;font:inherit;font-weight:700;cursor:pointer;min-height:48px}
.btn.gold{background:var(--gold);color:var(--deep)}
.btn.ghostd{background:transparent;color:var(--deep-fg);border:2px solid var(--deep-line)}
.top{background:radial-gradient(900px 500px at 30% 0%,#1d5a49 0%,transparent 65%),var(--deep);color:var(--deep-fg);padding-bottom:64px}
.nav{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:18px 0;flex-wrap:wrap}
.brand{color:#fff;text-decoration:none;font-family:var(--display);font-weight:700;font-size:18px;display:flex;align-items:center;gap:10px}
.mark{display:grid;grid-template-columns:1fr 1fr;gap:3px;width:26px;height:26px}
.mark i{border-radius:3px;background:#3fc79f}.mark i:first-child{background:var(--gold)}.mark i:last-child{background:#fff}
.nav a.l{color:var(--deep-fg);text-decoration:none;font-weight:500}
.hero{display:grid;grid-template-columns:auto 1fr;gap:44px;align-items:center;padding:30px 0}
.hero .badge-svg{filter:drop-shadow(0 24px 40px rgba(0,0,0,.45));animation:in .9s cubic-bezier(.2,1.4,.4,1) both}
@keyframes in{from{transform:scale(.5) rotate(-8deg);opacity:0}}
.ver{display:inline-flex;align-items:center;gap:8px;background:#173f34;border:1px solid var(--deep-line);color:#7fe3c2;font-weight:700;font-size:14px;padding:6px 12px;border-radius:999px}
.hero h1{color:#fff;font-size:clamp(28px,4.4vw,46px);margin:16px 0 8px}
.hero p{color:var(--deep-muted);margin:0 0 18px;font-size:18px}
.facts{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin:0 0 22px;padding:0;list-style:none}
.facts li{border:1px solid var(--deep-line);border-radius:14px;padding:10px 12px}
.facts span{display:block;font-size:12.5px;color:var(--deep-muted);font-family:var(--mono);letter-spacing:.05em}
.facts b{color:#fff;font-family:var(--display);font-size:17px}
.acts{display:flex;gap:10px;flex-wrap:wrap}
.panel{background:#fff;border:1px solid var(--line);border-radius:20px;padding:24px;margin:-34px 0 24px;position:relative;box-shadow:0 10px 30px rgba(12,42,35,.08)}
.panel h2{font-size:20px;margin:0 0 8px}
.panel p{margin:0 0 10px;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 0;padding:0;list-style:none}
.chips li{font-size:13.5px;font-weight:600;background:var(--soft);color:var(--accent);border-radius:999px;padding:4px 12px}
.cta{background:var(--deep);color:var(--deep-fg);border-radius:20px;padding:24px;display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;margin-bottom:50px}
.cta h2{color:#fff;margin:0 0 4px;font-size:20px}.cta p{margin:0;color:var(--deep-muted)}
.skel{height:260px;border-radius:20px;background:linear-gradient(90deg,#173f34,#1f4a3d,#173f34);background-size:200% 100%;animation:sh 1.2s infinite}
@keyframes sh{to{background-position:-200% 0}}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--deep);color:#fff;padding:10px 18px;border-radius:12px;font-weight:600}
footer{background:var(--deep);color:var(--deep-muted);padding:22px 0;font-size:14.5px}
footer .w{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}footer a{color:var(--deep-fg)}
@media (max-width:760px){.hero{grid-template-columns:1fr;text-align:center;justify-items:center}.facts{grid-template-columns:repeat(2,minmax(0,1fr))}.acts{justify-content:center}}
</style>
</head>
<body>
<div class="top"><div class="w">
  <nav class="nav" aria-label="Main"><a class="brand" href="./"><span class="mark" aria-hidden="true"><i></i><i></i><i></i><i></i></span>Widgetry Academy</a><a class="l" href="exam.html">Exam Center</a></nav>
  <div id="hero"><div class="skel"></div></div>
</div></div>
<div class="w" id="body"></div>
<footer><div class="w"><span>© 2026 Widgetry Academy · Kolkata, India</span><span><a href="terms.html">Terms</a> · <a href="privacy.html">Privacy</a> · <a href="contact.html">Contact</a></span></div></footer>

<script type="module">
import { JOBS_API } from './jobs-api-url.js';
import { badgeSVG, shareCard, badgeUrl, linkedInAdd } from './js/exam-badge.js';
const $ = id => document.getElementById(id);
const esc = t => { const d = document.createElement("div"); d.textContent = t ?? ""; return d.innerHTML; };
const COVERS = {
  junior: ["Layout constraints", "setState and rebuilds", "The State lifecycle", "Async and the event loop", "Dart null safety"],
  mid: ["Keys and element reuse", "InheritedWidget and Provider", "Bloc and Cubit traps", "Streams", "Animations and widget tests"],
  senior: ["The frame pipeline", "UI vs raster thread jank", "Isolates and memory", "Release builds", "Architecture and error handling"],
};
const id = new URLSearchParams(location.search).get("id") || "";

function fail(msg) {
  $("hero").innerHTML = `<div style="padding:40px 0"><h1 style="color:#fff">Badge not found</h1><p style="color:var(--deep-muted)">${esc(msg)}</p><a class="btn gold" href="exam.html">Go to the Exam Center</a></div>`;
}

async function load() {
  if (!/^[A-Za-z0-9]{6,12}$/.test(id)) return fail("This link doesn't point to a badge. Check it was copied in full.");
  let b;
  try {
    const r = await fetch(JOBS_API + "/exam/badges/" + encodeURIComponent(id));
    if (r.status === 404) return fail("We have no badge with this ID. It may have been typed wrong.");
    if (!r.ok) throw new Error();
    b = (await r.json()).badge;
  } catch { return fail("We couldn't check this badge right now. Please try again in a minute."); }
  const date = new Date(b.issuedAt).toLocaleDateString("en-IN", { day: "numeric", month: "long", year: "numeric" });
  document.title = `${b.name}: Flutter ${b.levelName} badge | Widgetry Academy`;
  $("hero").innerHTML = `<div class="hero">${badgeSVG(b.level, { size: 230, score: b.score, distinction: b.distinction })}
    <div><span class="ver">✓ Verified by Widgetry Academy</span>
      <h1>${esc(b.name)}</h1>
      <p>passed the <b style="color:#fff">Flutter ${esc(b.levelName)}</b> exam${b.distinction ? " with distinction" : ""}.</p>
      <ul class="facts"><li><span>SCORE</span><b>${b.score}%</b></li><li><span>CORRECT</span><b>${b.correct}/${b.total}</b></li><li><span>EARNED</span><b>${esc(date)}</b></li><li><span>BADGE ID</span><b>${esc(b.id)}</b></li></ul>
      <div class="acts"><a class="btn gold" href="${linkedInAdd(b)}" target="_blank" rel="noopener">Add to LinkedIn</a><button class="btn ghostd" id="dl" type="button">Download image</button><button class="btn ghostd" id="cp" type="button">Copy link</button></div>
    </div></div>`;
  $("body").innerHTML = `<div class="panel"><h2>What this badge covers</h2>
      <p>The ${esc(b.levelName)} exam has 15 questions drawn from a larger bank, answered against the clock, with 70% needed to pass. The questions ask how and why Flutter behaves the way it does, using real code.</p>
      <ul class="chips">${(COVERS[b.level] || []).map(c => `<li>${esc(c)}</li>`).join("")}</ul>
      <p class="small" style="margin:14px 0 0;font-size:14.5px">This is a practice exam badge from Widgetry Academy. It shows the person passed this exam with the score above. It isn't a job certificate or an official Google certification.</p></div>
    <div class="cta"><div><h2>How well do you know Flutter?</h2><p>Take the same exam. It's free, and every answer is explained.</p></div><a class="btn gold" href="exam.html">Take an exam →</a></div>`;
  $("dl").onclick = async () => { const blob = await shareCard(b); const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = `widgetry-flutter-${b.level}-badge.png`; a.click(); };
  $("cp").onclick = async () => { try { await navigator.clipboard.writeText(badgeUrl(b.id)); const t = document.createElement("div"); t.className = "toast"; t.textContent = "Link copied"; document.body.appendChild(t); setTimeout(() => t.remove(), 2200); } catch { prompt("Copy this link", badgeUrl(b.id)); } };
}
load();
</script>
</body>
</html>
